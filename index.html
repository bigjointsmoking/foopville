<style>
  /* Single dark look on purpose: it's a game screen, not a document. */
  :root {
    --bg: #0f0e0c;
    --ink: #e6dcc2;
    --dim: #aaa8a2;
    --edge: #3e3a32;
    --font: "Pixelify Sans", "Trebuchet MS", sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    box-sizing: border-box;
    padding-block: 12px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  #game { width: 100%; max-width: 1100px; flex: 1; min-height: 0; }
  #game canvas { touch-action: none; -webkit-user-select: none; user-select: none; border: 2px solid var(--edge); border-radius: 4px; }
  .foot { margin: 0; color: var(--dim); font-size: 13px; letter-spacing: 0.06em; text-align: center; }

  /* Phones and tablets (src/screen.js adds .touch): the game takes the whole screen,
     edge to edge, keeping clear of the notch and the home bar. */
  body.touch {
    position: fixed; inset: 0; margin: 0; overflow: hidden; overscroll-behavior: none;
    height: 100dvh; gap: 0;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
    touch-action: none; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
    -webkit-text-size-adjust: 100%;
  }
  body.touch #game { max-width: none; width: 100%; height: 100%; }
  body.touch #game canvas { border: 0; border-radius: 0; }
  body.touch .foot { display: none; }
  #turn { display: none; }
  @media (orientation: portrait) {
    body.touch:not(.upright-ok) #turn {
      display: flex; position: fixed; inset: 0; z-index: 10; background: var(--bg);
      flex-direction: column; align-items: center; justify-content: center; gap: 12px;
      padding: 24px; text-align: center; font-size: 22px; color: var(--ink);
    }
    #turn small { color: var(--dim); font-size: 14px; max-width: 280px; line-height: 1.4; }
    .turn-icon { font-size: 54px; }
  }
  #fs {
    position: fixed; z-index: 5; bottom: calc(6px + env(safe-area-inset-bottom, 0px)); left: calc(6px + env(safe-area-inset-left, 0px));
    width: 34px; height: 34px; padding: 0; border: 1px solid var(--edge); border-radius: 6px;
    background: rgba(15, 14, 12, 0.55); color: var(--ink); font-size: 18px; line-height: 1; opacity: 0.7;
  }
  body:not(.on-title) #fs, body.is-full #fs { display: none; }
  /* Loading bar before the title screen (src/loading.js) */
  #loading {
    position: fixed; inset: 0; z-index: 20; background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    transition: opacity 0.35s;
  }
  #loading.ld-gone { opacity: 0; pointer-events: none; }
  .ld-title { font-size: 34px; letter-spacing: 0.12em; color: var(--ink); }
  .ld-track { width: min(320px, 70vw); height: 14px; border: 2px solid var(--edge); border-radius: 4px; padding: 2px; }
  .ld-fill { height: 100%; width: 3%; background: var(--ink); border-radius: 2px; transition: width 0.15s linear; }
  .ld-text { font-size: 15px; color: var(--dim); }
</style>

<div id="game"></div>
<script src="src/loading.js"></script>
<p class="foot">FOOPVILLE · prototype v1.32 · fix the well, farm, cook, rebuild the Market, wade into the Marsh, pay (or punch) the tax goblin, upset the pigeons, raid the old storehouse, face the Mushroom Guardian, open the Vault, out-paperwork the Notary, sling a pebble</p>
